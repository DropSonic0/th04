# Exact-unit build replacements preserve these physical owners under an ASM
# basename; TASM derives a .code segment name from that historical input name.
# The maintained bytes remain local, while the compiler alias preserves the
# replacement object identity (VECTORFAR and CDGPNA) in the native link.
[compile_aliases]
"th03/vector.cpp" = "th04/vectorfar.asm"
"th04/cdg_p_na.cpp" = "th04/cdgpna.asm"

# Two historical dialog modules are one maintained physical producer. The
# midboss family has the same source-level fusion for its contiguous helpers.
[fused_owners]
"th04/f_dialog.cpp" = { physical_id = "main-dialog", local = "src/main/dialog/fused.cpp" }
"th04/dialog.cpp" = { physical_id = "main-dialog", local = "src/main/dialog/fused.cpp" }
"th04/midboss.cpp" = { physical_id = "main-midboss", local = "src/main/midboss/midboss.cpp" }
"th04/hud_hp.cpp" = { physical_id = "main-midboss", local = "src/main/midboss/midboss.cpp" }
"th04/mb_dft.cpp" = { physical_id = "main-midboss", local = "src/main/midboss/midboss.cpp" }

